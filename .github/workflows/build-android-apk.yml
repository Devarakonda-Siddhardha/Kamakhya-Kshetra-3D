name: Build Kamakhya Kshetra 3D Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot Export Templates & Debug Keystore
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot" builds
          for src in /root/.local/share/godot/export_templates/4.3.stable /root/.local/share/godot/templates/4.3.stable; do
            if [ -d "$src" ] && [ ! -e "$HOME/.local/share/godot/export_templates/4.3.stable" ]; then
              cp -r "$src" "$HOME/.local/share/godot/export_templates/4.3.stable"
            fi
          done
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable" || find /root /usr /opt -maxdepth 5 -name "android_debug.apk" 2>/dev/null || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore /tmp/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JAVA_PATH="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which javac || which java)")")")}"
          echo "Using ANDROID_SDK=${SDK_PATH} JAVA_SDK=${JAVA_PATH}"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "${JAVA_PATH}"
          export/android/android_sdk_path = "${SDK_PATH}"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Assets & Export Android Debug APK
        working-directory: godot
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" ../builds/kamakhya-kshetra-3d.apk
          ls -lh ../builds/kamakhya-kshetra-3d.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kamakhya-kshetra-3d-apk
          path: builds/kamakhya-kshetra-3d.apk
